<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scanner d'arnaques SMS</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="conteneur">
    <h1>🛡️ Scanner d'arnaques SMS</h1>
    <p class="sous-titre">Colle ici un SMS Mobile Money qui te semble suspect. N'utilise que des messages fictifs ou sans vrais numéros.</p>

    <form id="formulaire">
      <label for="sms">Texte du SMS</label>
      <textarea id="sms" rows="6" maxlength="8000" placeholder="Colle le SMS ici..." ></textarea>

      <div class="exemples">
        <span>Exemples fictifs :</span>
        <button type="button" class="exemple" data-sms="Vous avez recu 25000 FCFA par erreur. Renvoyez-moi vite cet argent au 90 00 00 00 svp, c'est urgent, je suis dans l'embarras.">Faux dépôt</button>
        <button type="button" class="exemple" data-sms="FELICITATIONS ! Vous avez gagné 500000 FCFA au grand concours. Envoyez votre code secret et 5000 FCFA de frais pour recevoir votre gain: http://gain-moov.example">Faux gain</button>
        <button type="button" class="exemple" data-sms="Salut, on se voit demain à 18h au marché ? Apporte la liste.">Message banal</button>
      </div>
      <label for="image">Ou envoie une capture d'écran du SMS</label>
      <input type="file" id="image" accept="image/png,image/jpeg,image/webp">

      <button type="submit" id="bouton">Analyser</button>
    </form>

    <section id="resultat" hidden></section>

    <p class="limites">Outil d'aide : il peut se tromper (faux positifs et faux négatifs) et ne remplace pas une vérification auprès de Moov Money ou T-Money.</p>
  </main>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
